[tool.ruff]
# ODI Gatekeeper — Configuracion de ruff para Python linting
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# Reglas activadas:
# E = errores de estilo (pycodestyle)
# F = errores logicos (pyflakes) — imports no usados, variables indefinidas
# I = orden de imports (isort)
# S = seguridad (bandit) — inyeccion SQL, eval(), exec()
# B = bugs comunes (flake8-bugbear)
select = ["E", "F", "I", "S", "B"]

# Reglas ignoradas (para no ser demasiado estricto en scripts legacy):
ignore = [
    "E501",   # lineas largas (ya controlado por line-length)
    "S101",   # uso de assert (comun en tests)
    "S603",   # subprocess sin shell=True (falso positivo en scripts de sistema)
    "S607",   # subprocess con path parcial (comun en scripts)
]

[tool.ruff.lint.per-file-ignores]
# Scripts legacy pueden tener mas flexibilidad
"12_*.py" = ["E", "F"]
"13_*.py" = ["E", "F"]
"19_*.py" = ["E", "F"]
"20_*.py" = ["E", "F"]
